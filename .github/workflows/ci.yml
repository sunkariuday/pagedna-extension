name: PageDNA CI

on:
  push:
    pull_request:

    jobs:
      test:
          runs-on: ubuntu-latest
              steps:
                    - uses: actions/checkout@v4
                          - uses: actions/setup-node@v4
                                  with:
                                            node-version: 20
                                                  - run: npm test
                                                        - name: Check JavaScript syntax
                                                                shell: bash
                                                                        run: find src tests -name '*.js' -print0 | xargs -0 -n1 node --check
                                                                        
