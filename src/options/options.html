<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageDNA Settings</title><link rel="stylesheet" href="options.css"></head><body><main><header><div class="mark">P</div><div><h1>PageDNA settings</h1><p>Control alerts without weakening baseline protection.</p></div></header><section class="panel"><h2>Monitoring</h2><label><input id="paused" type="checkbox"> Pause monitoring</label><label><input id="mediumNotifications" type="checkbox"> Notify for medium risk</label><label><input id="highNotifications" type="checkbox"> Notify for high risk</label><label><input id="criticalNotifications" type="checkbox"> Notify for critical risk</label></section><section class="panel"><h2>Risk thresholds</h2><label>Medium starts at <input id="medium" type="number" min="0" max="100"></label><label>High starts at <input id="high" type="number" min="0" max="100"></label><label>Critical starts at <input id="critical" type="number" min="0" max="100"></label><button id="save">Save settings</button><span id="saved"></span></section><section class="panel note"><h2>Privacy</h2><p>PageDNA stores semantic structure and origins only. It does not store passwords, cookies, tokens, or form values. Baselines are versioned and are never replaced silently.</p></section></main><script src="options.js"></script></body></html>
