<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageDNA</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="brand"><span class="mark">P</span><div><h1>PageDNA</h1><p>Semantic integrity monitor</p></div></div><button id="pauseBtn" class="iconBtn" title="Pause monitoring">Ⅱ</button></header>
  <main>
    <section id="statusCard" class="card"><div class="eyebrow">CURRENT PAGE</div><div id="statusTitle" class="statusTitle">Scanning…</div><div id="origin" class="origin">—</div><div id="statusSummary" class="summary">Reading the page’s security-relevant structure.</div></section>
    <section id="scoreCard" class="card scoreGrid hidden"><div><div class="eyebrow">DNA MATCH</div><div id="match" class="bigNumber">—</div></div><div><div class="eyebrow">RISK SCORE</div><div id="score" class="bigNumber">—</div></div></section>
    <section id="metrics" class="metricGrid hidden"><div><b id="scripts">0</b><span>Scripts</span></div><div><b id="origins">0</b><span>External origins</span></div><div><b id="frames">0</b><span>IFrames</span></div><div><b id="forms">0</b><span>Sensitive forms</span></div></section>
    <section id="changesCard" class="card hidden"><div class="eyebrow">EVIDENCE</div><ul id="changes"></ul></section>
    <div id="actions" class="actions"></div>
    <section class="footerLinks"><button id="historyBtn" class="linkBtn">View history</button><button id="optionsBtn" class="linkBtn">Settings</button></section>
  </main>
  <script src="popup.js"></script>
</body></html>
